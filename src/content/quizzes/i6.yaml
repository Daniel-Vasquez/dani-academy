course: I6
passingScore: 4
questions:
  - prompt: "¿Qué significan los permisos 644 (`-rw-r--r--`) de un archivo?"
    options:
      - "Que todos pueden leer, escribir y ejecutar el archivo."
      - "Que solo el dueño puede leerlo y nadie más puede verlo."
      - "Que el archivo es un programa ejecutable."
      - "Que el dueño puede leerlo y modificarlo (6 = 4 + 2), y el grupo y los demás solo leerlo (4)."
    answer: 3
    explanation: "Cada cifra es un juego de permisos: dueño, grupo y otros, con r = 4, w = 2 y x = 1. 644 es el permiso normal de un archivo; para un secreto como .env se usa 600 (solo el dueño), y para una carpeta o un programa, 755. Recuerda que para leer un archivo también hace falta x en todas las carpetas del camino (I6.2)."

  - prompt: "¿Por qué se desactiva el inicio de sesión por contraseña en SSH?"
    options:
      - "Porque las contraseñas hacen la conexión más lenta."
      - "Porque cualquier servidor con el puerto 22 abierto recibe intentos automáticos sin parar, y una contraseña débil o reutilizada acaba cayendo; con una clave, no hay nada que adivinar."
      - "Porque SSH no cifra las contraseñas."
      - "Porque así no hace falta crear usuarios en el servidor."
    answer: 1
    explanation: "Con PasswordAuthentication no, solo entra quien tenga la clave privada, que nunca viaja por la red. Se configura en un archivo de /etc/ssh/sshd_config.d/ que se lea antes que los del proveedor (gana el primer valor leído) y se comprueba con sshd -T y desde fuera: «Permission denied (publickey)» (I6.3)."

  - prompt: "¿Qué diferencia hay entre SIGTERM y SIGKILL?"
    options:
      - "SIGTERM pide al proceso que termine y le deja cerrar en orden (o incluso ignorarla); SIGKILL lo elimina el núcleo al instante, sin avisarle ni dejarle limpiar nada."
      - "Son la misma señal con distinto nombre."
      - "SIGTERM reinicia el proceso y SIGKILL lo pausa."
      - "SIGKILL solo la puede enviar systemd."
    answer: 0
    explanation: "kill envía SIGTERM; kill -9, SIGKILL. En I6.4, con SIGTERM el servidor Node escribió «cerrando en orden…» y salió con código 0; con SIGKILL desapareció sin una línea en el registro y con código 137 (128 + 9). systemctl stop envía SIGTERM; kill -9 se deja para cuando nada más funciona."

  - prompt: "¿Para qué sirve systemd?"
    options:
      - "Para instalar paquetes, como apt."
      - "Para configurar el firewall."
      - "Es el primer proceso del sistema (PID 1): arranca los servicios al encender el servidor, los vigila, los reinicia si caen y guarda su salida en el diario (journalctl)."
      - "Para conectarse a otros servidores de forma segura."
    answer: 2
    explanation: "Un archivo .service con User, WorkingDirectory, ExecStart y Restart=always, habilitado con systemctl enable --now, hace que la app se ejecute como un usuario sin privilegios, vuelva sola tras un kill -9 y arranque con el servidor. Con Node, nohup ni siquiera protege de SIGHUP (I6.4)."

  - prompt: "¿Qué hace `sudo ufw default deny incoming`?"
    options:
      - "Bloquea también todas las conexiones que salen del servidor."
      - "Hace que el firewall rechace por defecto toda conexión que llega y no tenga una regla que la permita; por eso hay que permitir SSH (ufw allow OpenSSH) antes de activarlo."
      - "Borra las reglas existentes y deja el servidor abierto."
      - "Desactiva el firewall."
    answer: 1
    explanation: "Es la regla de oro: denegar todo lo que entra y permitir solo lo necesario (22, 80 y 443). Medido en I6.5: el puerto 3000, sin regla, no responde (timeout de 5 s, porque ufw descarta los paquetes en silencio), mientras que el 80, permitido pero sin programa, rechaza al instante. La comprobación se hace desde fuera, contra la IP del servidor."
