course: B2
passingScore: 4
questions:
  - prompt: "Has editado `auth.ts` y has ejecutado `git add auth.ts`, pero todavía no has hecho commit. ¿Dónde está ese cambio?"
    options:
      - "Solo en el working directory."
      - "En el repositorio, como un commit nuevo."
      - "En la staging area, preparado para el próximo commit."
      - "En el remoto `origin`."
    answer: 2
    explanation: "`git add` copia el cambio del working directory a la staging area. Solo `git commit` lo convierte en un commit dentro del repositorio, y solo `git push` lo sube al remoto."

  - prompt: "Internamente, ¿qué es una rama en Git?"
    options:
      - "Un puntero (un nombre) que apunta a un commit."
      - "Una copia completa de los archivos del proyecto."
      - "Una carpeta oculta dentro de `.git` con su propio historial independiente."
      - "Una lista de los diffs pendientes de unir."
    answer: 0
    explanation: "Una rama es solo un nombre que apunta a un commit. Por eso crearla es instantáneo y no copia nada; al hacer commits, el puntero de la rama actual avanza."

  - prompt: "Un merge se detiene con conflictos en un archivo. ¿Cuál es la forma correcta de terminarlo?"
    code: |
      CONFLICT (content): Merge conflict in src/pages/temario.astro
    options:
      - "Ejecutar `git merge` otra vez hasta que funcione."
      - "Borrar el archivo y hacer `git commit`."
      - "Ejecutar `git reset --hard` para aceptar la versión remota."
      - "Editar el archivo, dejar el contenido correcto sin marcadores, hacer `git add` del archivo y luego `git commit`."
    answer: 3
    explanation: "Resolver un conflicto es editar el archivo hasta dejar la versión correcta y quitar los marcadores. Después, `git add` lo marca como resuelto y `git commit` completa el merge. Si quieres cancelar, usa `git merge --abort`."

  - prompt: "Ya subiste a GitHub un commit en `main` que introdujo un error. ¿Qué comando lo deshace de forma segura?"
    options:
      - "`git reset --hard HEAD~1` seguido de `git push --force`."
      - "`git revert <hash>`, que crea un commit nuevo que deshace el anterior."
      - "`git restore <hash>`."
      - "`git commit --amend`."
    answer: 1
    explanation: "`revert` deshace un commit creando otro nuevo, sin reescribir el historial, así que es seguro en ramas compartidas. `reset` y `--amend` reescriben el historial y solo deben usarse con commits que aún no has subido."

  - prompt: "¿Para qué sirve una Pull Request, aunque trabajes solo?"
    options:
      - "Para descargar los últimos cambios del remoto."
      - "Para crear una copia de seguridad del repositorio."
      - "Para proponer unir una rama, revisar todos sus cambios y ejecutar comprobaciones (CI, previews) antes de mezclarla."
      - "Para borrar ramas antiguas automáticamente."
    answer: 2
    explanation: "Una PR es una propuesta de unir una rama a otra con un espacio para revisarla. Te obliga a releer el diff completo, ejecuta comprobaciones automáticas y deja constancia de por qué se hizo el cambio."
