course: B3
passingScore: 4
questions:
  - prompt: "Quieres que `www.tudominio.com` apunte a tu proyecto de Vercel sin depender de una IP fija. ¿Qué registro DNS usas?"
    options:
      - "Un registro `MX` con el valor que indique Vercel."
      - "Un registro `CNAME` con el nombre que indique Vercel (por ejemplo, `cname.vercel-dns.com`)."
      - "Un registro `TXT` con la URL del proyecto."
      - "Un registro `NS` apuntando a Vercel."
    answer: 1
    explanation: 'Un `CNAME` dice "pregunta por este otro nombre", así Vercel puede cambiar la IP sin que toques nada. `MX` es para correo, `TXT` para verificaciones y `NS` cambia quién gestiona todo el dominio. Recuerda que la raíz del dominio no puede ser `CNAME`: ahí se usa un registro `A`.'

  - prompt: "¿Qué significa que un método HTTP sea idempotente?"
    options:
      - "Que no lleva cuerpo."
      - "Que la respuesta siempre es la misma."
      - "Que solo puede usarse con HTTPS."
      - "Que repetir la misma petición deja el servidor en el mismo estado que hacerla una vez."
    answer: 3
    explanation: "Marcar una sección como leída con `PUT` dos veces deja una sola marca: es idempotente. Enviar una evaluación con `POST` crea un intento nuevo cada vez: no lo es. `GET`, `PUT` y `DELETE` son idempotentes; `POST` no."

  - prompt: "Un usuario sin sesión llama a una API privada; otro, con sesión, intenta hacer algo que no le está permitido. ¿Qué códigos corresponden?"
    options:
      - "401 al primero y 403 al segundo."
      - "403 al primero y 401 al segundo."
      - "404 a los dos."
      - "500 al primero y 400 al segundo."
    answer: 0
    explanation: '401 significa "no sé quién eres" (no autenticado). 403 significa "sé quién eres y no puedes" (no autorizado). En Dani Academy, la API sin sesión responde 401 y una evaluación bloqueada responde 403.'

  - prompt: "¿Qué protege el atributo `HttpOnly` de la cookie de sesión?"
    options:
      - "Impide que la cookie viaje por HTTP sin cifrar."
      - "Impide que la cookie se envíe en peticiones desde otros sitios."
      - "Impide que JavaScript lea la cookie, así un script inyectado (XSS) no puede robar la sesión."
      - "Hace que la cookie caduque al cerrar el navegador."
    answer: 2
    explanation: "`HttpOnly` oculta la cookie a `document.cookie`. Que solo viaje por HTTPS es cosa de `Secure`; no enviarla desde otros sitios es cosa de `SameSite`; y la caducidad la deciden `Max-Age` o `Expires`."

  - prompt: "Un `fetch` desde `http://localhost:4321` a otra API falla en el navegador con un error de CORS, pero la misma petición funciona con `curl`. ¿Por qué?"
    options:
      - "Porque `curl` usa HTTPS y el navegador no."
      - "Porque la Same-Origin Policy la aplica el navegador; `curl` no la aplica. Se arregla con cabeceras CORS en el servidor de la API."
      - "Porque la API está caída para los navegadores."
      - 'Porque hay que añadir `mode: "no-cors"` al `fetch` para leer la respuesta.'
    answer: 1
    explanation: 'CORS es una protección del navegador: impide que el JavaScript de un origen lea respuestas de otro salvo que el servidor lo permita con `Access-Control-Allow-Origin`. `mode: "no-cors"` no lo arregla: devuelve una respuesta opaca que no puedes leer.'
