course: I2
passingScore: 4
questions:
  - prompt: "`Padre` tiene un estado `n` y pinta `<Hijo />`, que no recibe ninguna prop. Al pulsar el botón, ¿qué componentes se vuelven a renderizar?"
    code: |
      function Padre() {
        const [n, setN] = useState(0);
        return (
          <>
            <button onClick={() => setN(n + 1)}>{n}</button>
            <Hijo />
          </>
        );
      }
    options:
      - "Solo `Padre`: `Hijo` no usa `n`."
      - "`Padre` y `Hijo`: cuando un componente se renderiza, se renderizan todos sus hijos, aunque React solo toque en el DOM lo que ha cambiado."
      - "Ninguno: React actualiza directamente el texto del botón sin volver a llamar a los componentes."
      - "Solo `Hijo`, porque es el último en el árbol."
    answer: 1
    explanation: "Un re-render lo disparan el estado propio, el render del padre, un contexto que se lee o un store al que se está suscrito. `Hijo` se renderiza porque su padre lo hizo; que su DOM no cambie es otra fase (el commit). Para saltarse ese render haría falta `memo`."

  - prompt: "¿Por qué React prohíbe llamar a un hook dentro de un `if`?"
    options:
      - "Porque guarda los hooks de cada componente por orden de llamada: si un render llama a uno más o a uno menos, asigna el estado al hook equivocado."
      - "Porque los hooks son más lentos dentro de un `if`."
      - "Porque TypeScript no puede inferir el tipo del estado dentro de un bloque condicional."
      - "Porque un hook dentro de un `if` solo se ejecuta en el servidor."
    answer: 0
    explanation: "React no conoce los nombres de tus variables de estado: las identifica por su posición en la lista de hooks del componente. Si el orden cambia entre renders, React lanza errores como `Rendered more hooks than during the previous render`. La lógica condicional va dentro del hook, no alrededor."

  - prompt: "¿Cuándo es mejor `useReducer` que varios `useState`?"
    options:
      - "Siempre: `useState` está obsoleto en React 19."
      - "Solo cuando el estado es un número."
      - "Cuando el componente hace peticiones a una API, porque `useReducer` las gestiona automáticamente."
      - "Cuando varias variables cambian juntas en cada transición y hay combinaciones que no deberían darse nunca: un reducer puro concentra las transiciones y el estado puede modelarse como unión discriminada."
    answer: 3
    explanation: "Con varios `useState`, cada función tiene que acordarse de actualizar la combinación correcta, y un olvido produce estados contradictorios (un resultado con todas las respuestas vacías). Un reducer `(estado, acción) → estado` pone todas las transiciones en un solo sitio, es puro (no hace peticiones) y se prueba sin montar React."

  - prompt: "En una página de Astro, una isla con `<ProgresoProvider>` envuelve en el `.astro` a otras dos islas que usan `useProgreso()`. ¿Qué ocurre?"
    code: |
      <ProveedorIsla client:load>
        <IndiceIsla client:load />
        <BotonIsla client:load />
      </ProveedorIsla>
    options:
      - "Funciona: las islas hijas leen el contexto de la isla padre."
      - 'Funciona solo con `client:only="react"`.'
      - "Falla: cada isla es una aplicación de React independiente con su propia raíz, y lo que se anida en el `.astro` llega como HTML, así que las islas hijas no tienen ningún `Provider` por encima."
      - "Funciona, pero solo en producción."
    answer: 2
    explanation: "Astro renderiza e hidrata cada isla por separado, así que el contexto de React no cruza de una a otra. Para compartir estado entre islas se usa un store de módulo (nanostores), eventos del DOM o el servidor como fuente de verdad."

  - prompt: "¿Qué es una actualización optimista?"
    options:
      - "Enviar la petición varias veces por si alguna falla."
      - "Mostrar el cambio en la interfaz antes de que responda el servidor y deshacerlo (rollback) con un aviso si la petición falla."
      - "Guardar los cambios en `localStorage` y no enviarlos nunca al servidor."
      - "Esperar a que el servidor confirme antes de cambiar la interfaz."
    answer: 1
    explanation: "La interfaz responde al instante suponiendo que todo irá bien; si el servidor falla, vuelve al valor anterior y avisa. Se hace a mano (guardando el valor anterior) o con `useOptimistic`, cuyo valor provisional caduca solo al terminar la transición. No es adecuado para acciones irreversibles, como un pago."
