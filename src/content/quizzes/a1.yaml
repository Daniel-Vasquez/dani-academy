course: A1
passingScore: 4
questions:
  - prompt: "¿Qué hace `infer` en un tipo condicional?"
    options:
      - "Convierte un tipo en `any` para que TypeScript deje de comprobarlo."
      - "Comprueba al ejecutar que un valor tiene el tipo indicado."
      - "Captura el tipo que hay en una posición de otro tipo (el elemento de un array, el retorno de una función, el contenido de una Promise) para usarlo en la rama verdadera."
      - "Hace que un genérico sea opcional."
    answer: 2
    explanation: "En A1.1, `T extends (infer U)[] ? U : never` da el elemento de un array, y así están hechos ReturnType, Parameters y Awaited. infer no comprueba nada: si T no tiene esa forma, el resultado es la rama falsa (por ejemplo, never)."

  - prompt: "¿Cómo se renombran las claves en un mapped type?"
    options:
      - "Con `as` dentro de la clave: `{ [K in keyof T as NuevoNombre]: T[K] }`; y si el nuevo nombre es never, la clave desaparece."
      - 'Con `Rename<T, "a", "b">`, que trae TypeScript.'
      - "No se puede: un mapped type siempre conserva los nombres."
      - "Con `Omit` y después `Pick`."
    answer: 0
    explanation: "En A1.2, `` [K in keyof T as `get${Capitalize<string & K>}`] `` convierte minutos en getMinutos, y `T[K] extends V ? K : never` filtra propiedades por su tipo, como en ClavesNumericas para ordenarPor."

  - prompt: "¿Para qué sirve un template literal type?"
    options:
      - "Para escribir plantillas de HTML con tipos."
      - "Para formatear textos al ejecutar, como una plantilla de JavaScript."
      - "Para convertir números en textos sin perder el tipo."
      - "Para describir textos con formato (IDs, nombres de eventos, rutas), de modo que el compilador detecte uno mal escrito."
    answer: 3
    explanation: "En A1.3, SeccionId hecho con dígitos rechaza B9.1, X1.3 o B1.123 al compilar, igual que la expresión regular de la plataforma al ejecutar. Ojo: con ${number} se colaban B1.1e3, B1.-2 o B1.1.5."

  - prompt: "¿Qué problema resuelven los branded types?"
    options:
      - "Que los IDs ocupen menos memoria."
      - "Que dos IDs del mismo tipo base (por ejemplo, un curso y una sección, ambos string) no se puedan intercambiar por error al llamar a una función."
      - "Que un string se valide solo al ejecutar."
      - "Que los IDs se guarden cifrados en la base de datos."
    answer: 1
    explanation: "En A1.4, con simples alias, marcarLeida(usuario, seccion, curso) compiló y registró la lectura al revés; con marcas, es un error al compilar. La marca no existe al ejecutar: sigue siendo un string, y se crea solo en la frontera, comprobando el formato."

  - prompt: "¿Qué diferencia hay entre `satisfies` y anotar el tipo de una variable?"
    options:
      - "Ninguna: son dos formas de escribir lo mismo."
      - "satisfies no comprueba nada, solo documenta."
      - "Las dos comprueban el valor, pero la anotación sustituye su tipo por el anotado y satisfies conserva el del valor (sus claves y, con plantillas o as const, sus valores exactos)."
      - "La anotación solo funciona con objetos y satisfies solo con arrays."
    answer: 2
    explanation: 'En A1.4, con `const rutas: Record<string, Ruta>`, rutas.estadisticas compilaba y valía undefined; con `satisfies Record<string, Ruta>`, es un error, y rutas.progreso conserva su tipo exacto "/progreso".'
