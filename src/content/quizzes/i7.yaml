course: I7
passingScore: 4
questions:
  - prompt: "¿Qué diferencia hay entre un token primitivo y uno semántico?"
    options:
      - "El primitivo nombra un valor (`slate-200`, `#0d9488`); el semántico nombra un papel (`surface`, `muted`, `accent`). Los componentes usan los semánticos, y cambiar el diseño o el tema es cambiar sus valores en un solo sitio."
      - "El primitivo es de Tailwind y el semántico de CSS, pero significan lo mismo."
      - "El semántico solo se usa en modo oscuro."
      - "El primitivo es para texto y el semántico para fondos."
    answer: 0
    explanation: 'En I7.1, mientras tw-lab usaba colores directos, cambiar --surface no cambiaba ningún elemento. Tras sustituir los 117 colores directos por tokens, una línea cambia todas las superficies, y el modo oscuro es dar otros valores a los mismos tokens bajo [data-theme="dark"].'

  - prompt: "¿Cómo se evita el parpadeo (un destello claro) al cargar una página en modo oscuro?"
    options:
      - "Aplicando el tema en un useEffect de un componente de React."
      - "Con transition-colors en el body, para que el cambio sea suave."
      - "Con un script diminuto en línea en el <head>, que lee localStorage (o prefers-color-scheme) y pone data-theme en <html> antes del primer pintado; y reaplicándolo en astro:after-swap al navegar con View Transitions."
      - "Guardando el tema en una cookie que lee el navegador después de cargar."
    answer: 2
    explanation: "Medido en I7.2 con la CPU lenta y una red lenta: desde React, el tema llegó más de 600 ms después del primer pintado; un script empaquetado ganó o perdió por milisegundos; el script en línea se aplicó siempre antes, con unos 310 ms de margen. Sin el listener de astro:after-swap, la página siguiente volvía a claro."

  - prompt: "¿Qué medida de línea se recomienda para la lectura de textos largos?"
    options:
      - "Todo el ancho de la pantalla, para que quepa más texto."
      - "Entre 60 y 75 caracteres por línea, con un interlineado de 1,6 a 1,8."
      - "Unos 20 caracteres por línea."
      - "Exactamente 100 caracteres, el estándar de los editores de código."
    answer: 1
    explanation: "Con más caracteres, al ojo le cuesta volver al principio de la siguiente línea; con menos, salta de línea demasiado. En I7.3, max-w-[68ch] dio unos 70 caracteres por línea; sin límite, el mismo párrafo tenía 143 a 1280 px. prose-lg da 18 px de letra con 32 px de línea (1,78)."

  - prompt: "¿Cuál es el contraste mínimo WCAG AA para texto de tamaño normal?"
    options:
      - "2:1"
      - "3:1"
      - "7:1"
      - "4,5:1 (3:1 para texto grande, de 24 px o 18,7 px en negrita, y para iconos)"
    answer: 3
    explanation: "7:1 es el nivel AAA. En I7.4, el acento de la plataforma (#0d9488) sobre #fafafa dio 3,59:1: vale para fondos, bordes y texto grande, pero no para texto normal; por eso los enlaces usan --accent-strong (#0f766e, 5,24:1). Lighthouse dio 100 a una página en la que axe sí encontró un fallo de contraste."

  - prompt: "¿Cuándo se usa `aria-pressed`?"
    options:
      - "En todos los botones, para que el lector de pantalla los anuncie."
      - "En los enlaces de la página actual."
      - "En un botón que funciona como interruptor (se activa y se desactiva) y cuyo texto no cambia, como «Modo oscuro»: el lector de pantalla dice si está activado."
      - "En las casillas de verificación nativas."
    answer: 2
    explanation: "La primera regla de ARIA es no usarlo si el HTML ya lo resuelve: un botón «Guardar» no tiene estado, y una casilla nativa ya dice si está marcada. Para la página actual de un menú se usa aria-current. El BotonTema de I7.2 cambia aria-pressed entre true y false al pulsarlo."
