course: B7
passingScore: 4
questions:
  - prompt: "En un proyecto con Tailwind v4, ¿dónde defines un color propio como `accent` para poder usar `bg-accent`?"
    options:
      - "En `tailwind.config.js`, dentro de `theme.extend.colors`."
      - "En el CSS, dentro de `@theme`, con una variable `--color-accent`."
      - "En `astro.config.mjs`, en las opciones del plugin."
      - "En `package.json`, en un campo `tailwind`."
    answer: 1
    explanation: "Tailwind v4 se configura desde CSS: cada variable de `@theme` genera sus utilidades (`--color-accent` → `bg-accent`, `text-accent`…). `tailwind.config.js` es de la versión 3 y v4 no lo lee por defecto."

  - prompt: "¿Qué significa `grid gap-4 sm:grid-cols-2 lg:grid-cols-3`?"
    options:
      - "Dos columnas en móvil y tres en pantallas pequeñas."
      - "Tres columnas siempre, salvo en pantallas `sm`."
      - "Una columna por defecto, dos a partir de 640 px y tres a partir de 1024 px."
      - "Dos columnas solo en móvil y tres solo en escritorio."
    answer: 2
    explanation: 'Tailwind es *mobile-first*: lo que no tiene prefijo se aplica siempre, y `sm:`/`lg:` se aplican a partir de ese ancho. `sm:` no significa "en móvil", sino "desde 640 px".'

  - prompt: "Quieres colocar la marca a la izquierda y la navegación a la derecha en una cabecera de una sola fila. ¿Qué es más adecuado?"
    options:
      - "`flex items-center justify-between`, porque es una sola dimensión."
      - "`grid grid-rows-2`, porque son dos elementos."
      - "Dos `div` con `float-left` y `float-right`."
      - "`grid grid-cols-[repeat(auto-fill,minmax(16rem,1fr))]`."
    answer: 0
    explanation: "Flex coloca elementos en una dimensión y su tamaño depende del contenido: ideal para cabeceras, botones con icono o filas de etiquetas. Grid brilla con estructuras de filas y columnas, como rejillas de tarjetas o layouts de página."

  - prompt: "¿Para qué sirve `group` en este enlace?"
    code: |
      <a href="/cursos/b1" class="group block rounded-2xl border p-5">
        <h3 class="group-hover:underline">TypeScript desde cero</h3>
      </a>
    options:
      - "Agrupa las clases para que ocupen menos."
      - "Hace que el `h3` se subraye al pasar el ratón por cualquier parte de la tarjeta, no solo por el título."
      - "Convierte el enlace en un grid."
      - "Aplica los estilos solo al primer hijo."
    answer: 1
    explanation: "`group` marca al padre, y `group-hover:` aplica el estilo al hijo cuando el padre está en estado hover. `peer` hace lo mismo con un hermano anterior."

  - prompt: 'Un componente tiene `px-5` y quien lo usa le pasa `className="px-2"`. ¿Qué resuelve `tailwind-merge` dentro de `cn()`?'
    options:
      - "Ordena las clases alfabéticamente para que el HTML sea más legible."
      - "Convierte las clases en estilos en línea."
      - "Comprueba que las clases existen en Tailwind."
      - "Elimina la clase en conflicto (`px-5`) para que gane la última que se pasó (`px-2`); sin él, ganaría la que esté después en el CSS."
    answer: 3
    explanation: 'Si ambas clases llegan al HTML, el navegador aplica la que esté después en la hoja de estilos, no la que escribiste después. `twMerge` detecta que `px-5` y `px-2` controlan lo mismo y deja solo la última: `cn("px-5 py-3", "px-2")` da `"py-3 px-2"`.'
