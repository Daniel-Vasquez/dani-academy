course: B6
passingScore: 4
questions:
  - prompt: "Al pulsar este botón, el número no cambia en pantalla. ¿Por qué?"
    code: |
      export function Contador() {
        let vasos = 0;
        return <button onClick={() => (vasos = vasos + 1)}>Vasos: {vasos}</button>;
      }
    options:
      - "Porque falta `e.preventDefault()` en el manejador."
      - "Porque cambiar una variable normal no avisa a React para volver a pintar, y en cada render la variable vuelve a valer 0. Hay que usar `useState`."
      - "Porque los botones de React no admiten `onClick` con funciones flecha."
      - "Porque `vasos` debería declararse con `const`."
    answer: 1
    explanation: "Solo el estado (`useState`) provoca un nuevo render al cambiar y conserva su valor entre renders. Una variable local se reinicia cada vez que se ejecuta la función del componente."

  - prompt: "¿Para qué sirve la prop `key` en una lista, y por qué no conviene usar el índice si la lista cambia de orden?"
    options:
      - "Le da a React una identidad estable para cada elemento; con el índice, al reordenar o borrar, React asocia el estado de un elemento a otro."
      - "Ordena la lista alfabéticamente."
      - "Es obligatoria solo en TypeScript; con el índice basta."
      - "Sirve para que el elemento sea accesible con el teclado."
    answer: 0
    explanation: "React usa la `key` para saber qué elemento es cuál entre renders. Si usas el índice y borras el primero, todos cambian de índice y el estado interno (por ejemplo, un texto a medio escribir) acaba en el elemento equivocado. Usa un id del dato."

  - prompt: "¿Qué ocurre si este efecto no devuelve la función de limpieza y el componente se monta y desmonta varias veces?"
    code: |
      useEffect(() => {
        const id = window.setInterval(() => setSegundos((s) => s + 1), 1000);
        return () => window.clearInterval(id);
      }, []);
    options:
      - "Nada: React detiene los intervalos automáticamente."
      - "El efecto no se ejecutaría nunca."
      - "React lanza un error en producción."
      - "Cada montaje deja un intervalo vivo que nadie detiene: se acumulan y siguen ejecutándose."
    answer: 3
    explanation: "La función que devuelve el efecto es la limpieza: React la llama antes de repetir el efecto y al desmontar. Sin ella, los intervalos, *listeners* o peticiones que creó el efecto quedan vivos."

  - prompt: "¿Qué diferencia hay entre un input controlado y uno no controlado?"
    options:
      - "El controlado solo acepta números."
      - "El no controlado no se puede enviar en un formulario."
      - "En el controlado, el valor vive en el estado de React (`value` + `onChange`); en el no controlado lo guarda el navegador y lo lees al enviar (`FormData`)."
      - "El controlado no necesita `onChange`."
    answer: 2
    explanation: "Controlado = React manda: permite validar o formatear mientras se escribe. No controlado = el navegador manda: más simple cuando solo lees los valores al enviar. Un `value` sin `onChange` deja el input bloqueado."

  - prompt: 'El botón "Marcar como leído" está al final de una sección larga. ¿Qué directiva conviene y por qué?'
    options:
      - "`client:load`, porque todos los componentes de React deben cargarse al inicio."
      - "`client:visible`: el JavaScript se descarga y la isla se hidrata cuando el botón entra en pantalla, sin retrasar la carga inicial."
      - "Ninguna: los componentes de React son interactivos por defecto en Astro."
      - '`client:only="react"`, porque así se renderiza en el servidor.'
    answer: 1
    explanation: "Sin directiva, un componente React en Astro es solo HTML. `client:visible` retrasa la descarga de JavaScript hasta que el componente es visible, ideal para lo que está por debajo del pliegue. `client:only` hace justo lo contrario de renderizar en el servidor."
