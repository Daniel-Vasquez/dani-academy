course: I8
passingScore: 4
questions:
  - prompt: "¿Qué diferencia hay entre un test unitario, uno de integración y uno end-to-end?"
    options:
      - "Ninguna: son tres nombres para lo mismo, según la herramienta que uses."
      - "El unitario prueba una pieza aislada (con sus dependencias sustituidas), el de integración varias piezas reales juntas (por ejemplo, el repositorio con un MongoDB de verdad) y el E2E la app entera desde un navegador."
      - "El unitario lo escribe el programador, el de integración el equipo de QA y el E2E el cliente."
      - "El unitario usa Vitest, el de integración Jest y el E2E Selenium."
    answer: 1
    explanation: "En I8.1, 16 tests unitarios tardaron unos 155 ms y 3 de integración unos 460 ms, casi todo en arrancar MongoDB; los E2E levantan además la app y un navegador. En I8.4, el test de integración encontró un bug que el unitario, con un repositorio falso, no podía ver."

  - prompt: "¿Qué es la estructura AAA de un test?"
    options:
      - "Arrange, Act, Assert: preparar los datos, hacer una sola acción con lo que se prueba y comprobar el resultado."
      - "Async, Await, Assert: todo test debe ser asíncrono."
      - "Una clasificación de los tests por importancia: A, AA y AAA."
      - "Un test por cada archivo, por cada función y por cada línea."
    answer: 0
    explanation: "Una sola acción por test: si un test crea, edita y borra, y falla, no sabes cuál de las tres falló. Y el valor esperado se calcula a mano, nunca copiando lo que devuelve la función."

  - prompt: "¿Por qué Testing Library recomienda buscar los elementos por su rol y su nombre (getByRole, getByLabelText)?"
    options:
      - "Porque es la única forma de encontrar elementos en jsdom."
      - "Porque es más rápido que buscar por selector CSS."
      - "Porque así lo exige React 19."
      - "Porque el test busca como una persona (o un lector de pantalla): no se rompe al cambiar clases de Tailwind y sí detecta un fallo real de accesibilidad."
    answer: 3
    explanation: "Medido en I8.3: con un cambio solo visual de clases, el test que buscaba p.error falló y el que buscaba por rol siguió pasando; al quitar el aria-describedby del campo, el test por clase siguió en verde y el que buscaba por rol detectó el error."

  - prompt: "¿Para qué sirve `mongodb-memory-server`?"
    options:
      - "Para guardar en memoria la caché de las consultas de producción."
      - "Para arrancar un MongoDB de verdad, en memoria y desechable, contra el que los tests de integración y los E2E prueban consultas reales sin tocar tu base."
      - "Para simular MongoDB con un objeto de JavaScript, sin ejecutar consultas."
      - "Para hacer copias de seguridad de Atlas en el ordenador."
    answer: 1
    explanation: "Es un servidor de MongoDB real: en I8.4 descubrió que $set con ignoreUndefined no borra un campo, algo que el repositorio falso no reproducía. Y en I8.5, MongoMemoryReplSet da el replica set que Better Auth necesita para sus transacciones."

  - prompt: "¿Qué es un test flaky?"
    options:
      - "Un test que tarda más de un segundo."
      - "Un test sin ningún expect."
      - "Un test que pasa unas veces y falla otras sin que cambie el código, por datos compartidos, fechas, red, estado global o esperas fijas."
      - "Un test que se ejecuta solo en CI."
    answer: 2
    explanation: "En I8.4, el test del repositorio de I3.5 fallaba en 4 de 10 órdenes porque dependía de los datos de otro test; en I8.2, un bug de zona horaria pasaba en UTC y fallaba en otras zonas. Los reintentos lo esconden, no lo arreglan."
