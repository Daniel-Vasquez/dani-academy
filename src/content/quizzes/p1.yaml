course: P1
mode: self
passingScore: 4
questions:
  - prompt: "Justifica el modelo de datos de tu proyecto: qué colecciones tiene, qué embebes o copias, qué índices creaste y por qué."
    rubric:
      - "parte de los patrones de acceso escritos (P1.2), con su frecuencia, y no de una lista de entidades."
      - "justifica cada dato embebido o copiado con un patrón concreto, y dice qué cuesta mantener la copia cuando cambia el original, como el color de una categoría."
      - "señala qué patrón usa cada índice, y nombra al menos un índice que decidiste no crear, con su motivo."

  - prompt: "¿Cómo impide tu proyecto que un usuario lea o cambie los datos de otro?"
    rubric:
      - "explica que el identificador del usuario sale de la sesión, nunca de la URL ni del cuerpo de la petición."
      - "muestra que el filtro por usuario va en la consulta del repositorio, y no en una comprobación que cada ruta tenga que recordar."
      - "dice qué responde ante un dato ajeno (404 y no 403, para no confirmar que existe) y qué test lo comprueba, y que ese test falla si quitas la protección."

  - prompt: "Describe la estrategia de testing de tu proyecto: qué pruebas en cada capa y por qué ahí."
    rubric:
      - "distingue los tres niveles (unitario, integración y E2E) con un ejemplo real de tu proyecto en cada uno."
      - "explica por qué cada cosa se prueba en su nivel: las reglas puras en unitarios, la base de datos real en integración y el recorrido del usuario en E2E."
      - "cuenta cómo comprobaste que algún test detecta el fallo que vigila, y qué riesgo importante no cubren tus tests."

  - prompt: "Explica el despliegue de tu proyecto, desde un push a `main` hasta producción, y qué pasa si la versión nueva falla."
    rubric:
      - "recorre los pasos en orden: el CI, el despliegue del mismo commit que pasó el CI, la imagen y la comprobación de salud."
      - "explica cómo se vuelve a la versión anterior y qué lo hace posible, por ejemplo una imagen por commit que sigue en el servidor."
      - "dice qué queda por hacer tras volver atrás (`main` sigue roto hasta un `git revert`) y cuánto tiempo sin servicio cuesta un despliegue fallido."

  - prompt: "¿Qué decisión técnica de tu proyecto te enseñó más, y qué harías distinto si empezaras de nuevo?"
    rubric:
      - "describe una decisión concreta, con su contexto y las alternativas que había."
      - "apoya lo aprendido en hechos (un error, una medida o un test que falló), no solo en una opinión."
      - "dice qué cambiarías y por qué, o por qué la mantendrías, y dónde dejaste escrita la decisión, como un ADR."
