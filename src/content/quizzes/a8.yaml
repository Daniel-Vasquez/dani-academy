course: A8
passingScore: 4
questions:
  - prompt: "¿Qué aporta este esquema a una Content Collection?"
    code: |
      schema: z.object({
        titulo: z.string().min(1),
        orden: z.number().int().positive(),
        resumen: z.string().max(120),
      })
    options:
      - "Hace que Astro genere las páginas de cada entrada, sin necesidad de escribir `getStaticPaths`."
      - 'Corrige solo los datos: convierte `orden: "2"` en número y recorta un `resumen` demasiado largo.'
      - "Valida los datos en el navegador durante cada visita, y muestra un aviso en la página si algún campo no es correcto."
      - "Valida cada frontmatter y da tipos a `data`: un dato incorrecto rompe el build con un mensaje claro."
    answer: 3
    explanation: 'En A8.1, `orden: "2"` dio código 1 con la entrada, el campo y el problema. No todo se detiene: un `reference` a un curso inexistente o una errata en `data` terminaron con código 0. Por eso hacen falta `astro check` y comprobar lo que devuelve `getEntry`.'

  - prompt: "¿Para qué sirve `server:defer` en esta página?"
    code: |
      <ProgresoUsuario server:defer seccionId={seccion.id}>
        <p slot="fallback">Cargando progreso…</p>
      </ProgresoUsuario>
    options:
      - "Para ejecutar el componente en el navegador cuando el navegador esté libre, como `client:idle`."
      - "Para servir la página cacheada y pedir aparte al servidor solo ese trozo personal, sin enviar React."
      - "Para guardar en la caché de Nginx el resultado del componente, y compartirlo entre todas las personas."
      - "Para esperar a que el componente termine en el servidor antes de enviar el HTML de toda la página."
    answer: 1
    explanation: "En A8.2, el LCP bajó de 176 a 16 ms, y siguió igual con una consulta de 800 ms. Pero la isla no es inmune a una caché mal puesta: Bob vio el dato de Ana con una microcaché global. Por eso lleva `Cache-Control: private, no-store`, y necesita una `ASTRO_KEY` fija entre despliegues."

  - prompt: "Dos islas de React deben mostrar las secciones leídas sin contradecirse. ¿Cuál es la forma correcta?"
    options:
      - "Un store de Nanostores en el navegador, sembrado desde el servidor, que obedece al servidor tras cada cambio."
      - "Un `useState` en cada isla, y un `useEffect` en cada una que compare los dos valores después de cada render de la página."
      - "Un `$leidas.set()` en el frontmatter de la página, para que el store llegue relleno a todas las islas."
      - "Un `Context` de React en el layout, porque Astro lo comparte automáticamente entre todas sus islas."
    answer: 0
    explanation: "Cada isla es un árbol de React aparte, así que `useState` y `Context` no se cruzan entre ellas. Escribir en el store desde el servidor es peligroso: en A8.3, Bob recibió el contador de Ana en 3 de 20 intentos. Las otras pestañas se avisan con `BroadcastChannel`, solo tras la confirmación del servidor."

  - prompt: "¿Qué diferencia a organizar por features de organizar por tipo?"
    options:
      - "Por features, cada componente va en su propio repositorio, y por tipo todos comparten el mismo."
      - "Por tipo, el código funciona solo en el servidor, y por features funciona también en el navegador."
      - "Por features, lo que cambia junto vive junto; por tipo, una funcionalidad se reparte por varias carpetas."
      - "Son lo mismo con otros nombres de carpeta: la diferencia es solo de gusto y no se nota al hacer ningún cambio en el código."
    answer: 2
    explanation: "En A8.4, Mis marcas pasó de 10 archivos a 8, y de 3 archivos ajenos editados a ninguno. La prueba es borrarla: por features bastó quitar su carpeta, sus rutas y su test. Un límite solo es real si una regla lo protege, y un `export *` metió MongoDB en el navegador con el build en verde."

  - prompt: "¿Qué es un ADR?"
    options:
      - "Un test automático que comprueba en el CI que la arquitectura del proyecto no ha cambiado."
      - "Un documento largo que describe cada módulo del código, y que se actualiza con cada commit."
      - "Una lista con los fallos pendientes del proyecto, ordenados por impacto y por esfuerzo."
      - "Un archivo corto que guarda una decisión, su motivo, lo descartado y sus consecuencias."
    answer: 3
    explanation: "El código dice qué se hizo, pero no qué se descartó. Un ADR aceptado no se edita: si cambias de idea, escribes otro. La lista priorizada de pendientes es la deuda técnica de A8.5, que es otra cosa. En esa revisión, escribir las consecuencias de un ADR destapó un CI en rojo que no frenaba nada."
