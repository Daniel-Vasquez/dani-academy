course: B4
passingScore: 4
questions:
  - prompt: "¿Cuál es la diferencia principal entre una base de datos relacional y una documental?"
    options:
      - "Las relacionales no permiten relaciones entre datos; las documentales sí."
      - "Las documentales no guardan los datos en disco."
      - "Las relacionales organizan los datos en tablas con columnas fijas y se consultan con SQL; las documentales guardan documentos tipo JSON, que pueden anidar datos."
      - "Las relacionales solo funcionan con un usuario a la vez."
    answer: 2
    explanation: "Una base relacional (PostgreSQL, SQLite) usa tablas relacionadas mediante claves y SQL. Una documental (MongoDB) guarda documentos flexibles y anidados en colecciones. Ambas guardan en disco, admiten concurrencia y pueden representar relaciones."

  - prompt: "Un usuario lee muchas secciones y cada sección la leen muchos usuarios. ¿Qué relación es y cómo se representa en una base relacional?"
    options:
      - "1:1, con una columna en cada tabla."
      - "1:N, con una clave foránea en la tabla de usuarios."
      - "1:N, guardando la lista de secciones como texto en el usuario."
      - "N:M, con una tabla intermedia (por ejemplo, `lecturas`) que guarda pares usuario–sección."
    answer: 3
    explanation: "Es una relación muchos a muchos. Se resuelve con una tabla intermedia con las dos claves foráneas, que además puede tener sus propios datos, como la fecha de lectura. Guardar una lista en un texto rompe la primera forma normal."

  - prompt: "¿Qué hace esta consulta?"
    code: |
      SELECT u.nombre, s.titulo
      FROM lecturas l
      JOIN usuarios  u ON u.id = l.usuario_id
      JOIN secciones s ON s.id = l.seccion_id;
    options:
      - "Borra las lecturas de usuarios que no existen."
      - "Une las tablas por sus claves y devuelve el nombre del usuario y el título de cada sección que ha leído."
      - "Devuelve todas las secciones, incluidas las que nadie ha leído."
      - "Crea una tabla nueva con usuarios y secciones."
    answer: 1
    explanation: "`JOIN` combina filas de varias tablas cuando coinciden sus claves. Un `JOIN` normal solo devuelve filas con pareja en ambas tablas; para incluir también las secciones no leídas harías falta un `LEFT JOIN` desde `secciones`."

  - prompt: "¿Qué ganas y qué pierdes al crear un índice?"
    options:
      - "Ganas lecturas mucho más rápidas en los campos indexados; pierdes algo de velocidad en las escrituras y ocupas más espacio."
      - "Ganas escrituras más rápidas; pierdes la posibilidad de consultar por otros campos."
      - "Ganas espacio en disco; pierdes velocidad de lectura."
      - "No tiene costes: conviene indexar todas las columnas."
    answer: 0
    explanation: "Un índice evita recorrer toda la tabla (pasa de `SCAN` a `SEARCH … USING INDEX`), pero cada inserción o actualización debe mantenerlo al día y ocupa espacio. Por eso se indexan los campos por los que filtras u ordenas a menudo."

  - prompt: "En una transferencia se resta dinero de una cuenta y se suma en otra. ¿Qué garantiza la atomicidad de una transacción?"
    options:
      - "Que las dos operaciones se ejecuten en paralelo."
      - "Que nadie más pueda usar la base de datos durante la transferencia."
      - "Que se apliquen las dos operaciones o ninguna: nunca solo la resta."
      - "Que la operación sea más rápida."
    answer: 2
    explanation: "Atomicidad = todo o nada. Si falla algo entre la resta y la suma, `ROLLBACK` deshace la resta. Que las transacciones simultáneas no se vean a medias es el aislamiento (la I de ACID), no la atomicidad."
